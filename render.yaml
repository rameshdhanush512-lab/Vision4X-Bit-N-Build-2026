# ─────────────────────────────────────────────
# PRIVEX — Render.com Deployment
# Free tier — no credit card required
# ─────────────────────────────────────────────

services:
  - type: web
    name: privex-server
    runtime: node
    rootDir: server
    buildCommand: npm install --legacy-peer-deps && npx prisma generate --schema ../prisma/schema.prisma && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard → Environment
      - key: DIRECT_URL
        sync: false          # Set manually in Render dashboard → Environment
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: https://vision4x-privex.vercel.app   # Update after Vercel deploy
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3.2
    healthCheckPath: /health
